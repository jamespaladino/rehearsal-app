<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rehearsal V1</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shadcn.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/editor.css">

  <script src="vendor/lucide/lucide.min.js" defer></script>
  <script src="js/icons.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-top">
        <strong class="sidebar-brand">Rehearsal</strong>
        <div class="sidebar-buttons">
          <button id="collapseSidebar" class="btn btn-ghost btn-icon" type="button" aria-label="Close sidebar" data-tooltip="Close sidebar"><i data-lucide="panel-left"></i></button>
          <button id="newScript" class="btn btn-ghost btn-icon" type="button" aria-label="New script" data-tooltip="New script"><i data-lucide="plus"></i></button>
        </div>
      </div>
      <nav id="libraryPanel" class="sidebar-library" aria-label="Scripts">
        <ul id="library" class="sidebar-menu"></ul>
      </nav>
      <div class="sidebar-footer">
        <ul class="sidebar-menu">
          <li class="sidebar-menu-item">
            <button id="themeToggle" class="sidebar-menu-button" type="button" aria-label="Switch to dark mode"></button>
          </li>
        </ul>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-header">
        <button id="openSidebar" class="btn btn-ghost btn-icon hidden" type="button" aria-label="Open sidebar" data-tooltip="Open sidebar"><i data-lucide="panel-left"></i></button>

        <div class="header-title-group">
          <div id="titleDropdownWrap" class="title-dropdown-wrap hidden">
            <button id="topScriptTitle" class="btn btn-ghost" type="button" aria-expanded="false" aria-haspopup="true" aria-controls="titleDropdown"><span id="topScriptTitleText" class="truncate"></span></button>
            <form id="titleDropdown" class="popover title-dropdown hidden">
              <label for="quickRenameInput">Script name</label>
              <input id="quickRenameInput" maxlength="200" autocomplete="off" required>
              <div id="quickRenameError" class="error" aria-live="polite"></div>
              <div class="quick-rename-actions">
                <button id="quickRenameCancel" class="btn btn-outline" type="button">Cancel</button>
                <button class="btn btn-default" type="submit">Save</button>
              </div>
            </form>
          </div>
          <div id="topScriptActions" class="script-actions hidden">
            <button id="topScriptMenuToggle" class="btn btn-ghost btn-icon" type="button" aria-label="Script options" aria-haspopup="true" aria-expanded="false" data-tooltip="Script options"><i data-lucide="ellipsis"></i></button>
            <div id="topScriptMenu" class="dropdown-menu script-menu hidden">
              <button type="button" id="topRename" class="dropdown-menu-item"><i data-lucide="pen"></i>Rename</button>
              <button type="button" id="topDelete" class="dropdown-menu-item" data-variant="destructive"><i data-lucide="trash"></i>Delete</button>
            </div>
          </div>
        </div>

        <div class="header-right">
          <div class="mic-menu">
            <button id="micState" class="btn btn-ghost btn-icon" type="button" aria-label="Microphone: not connected" aria-haspopup="true" aria-expanded="false" aria-controls="micMenu" data-tooltip="Microphone: not connected"><i data-lucide="mic-off"></i></button>
            <div id="micMenu" class="dropdown-menu mic-dropdown hidden">
              <div id="micStatusLabel" class="dropdown-menu-label">Microphone: not connected</div>
              <div class="dropdown-menu-separator" role="separator"></div>
              <button id="connectMic" class="dropdown-menu-item" type="button"><i data-lucide="mic"></i>Connect microphone</button>
              <button id="releaseMic" class="dropdown-menu-item hidden" type="button"><i data-lucide="mic-off"></i>Release microphone</button>
            </div>
          </div>
          <button id="playButton" class="btn btn-default hidden" type="button" aria-label="Start rehearsal" data-tooltip="Start rehearsal"><i data-lucide="play" data-icon="inline-start"></i>Start</button>
        </div>
      </header>

      <main id="editor" class="editor hidden">
        <nav class="row hidden">
          <button id="back" class="btn btn-ghost" type="button"><i data-lucide="arrow-left" data-icon="inline-start"></i>Library</button>
          <button id="home" class="btn btn-ghost" type="button">Script overview</button>
        </nav>

        <div id="scriptHome">
          <h2 id="scriptHeading"></h2>
          <p class="muted">Choose how you want to work with this scene.</p>
          <div class="row">
            <button class="btn btn-default" id="enterRecord" type="button">Record mode</button>
            <button class="btn btn-default" id="enterPlay" type="button">Play mode</button>
          </div>
        </div>

        <div id="workspace" class="hidden">
          <input id="title" class="hidden" placeholder="Untitled script" aria-label="Script name">
          <div id="recordPanel" class="record-panel">
            <div id="turns" class="screenplay"></div>
            <div class="add-turn-actions">
              <button id="addLine" class="btn btn-secondary" type="button" data-tooltip="Add line"><i data-lucide="text-align-start" data-icon="inline-start"></i>Add line</button>
              <button id="addBeat" class="btn btn-secondary" type="button" data-tooltip="Add beat"><i data-lucide="gap-vertical" data-icon="inline-start"></i>Add beat</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="playPane" class="play-pane hidden" role="dialog" aria-modal="true" aria-labelledby="playPaneTitle">
    <header class="play-pane-header">
      <h2 id="playPaneTitle"></h2>
      <div class="play-pane-actions">
        <div class="help-menu">
          <button id="playHelpToggle" class="btn btn-ghost btn-icon" type="button" aria-label="Rehearsal tips" aria-haspopup="true" aria-expanded="false" aria-controls="playHelp" data-tooltip="Help"><i data-lucide="circle-question-mark"></i></button>
          <div id="playHelp" class="popover help-dropdown hidden">
            <p>Use headphones to prevent the reader's audio from triggering the microphone. Allow microphone access once per script session. The microphone disconnects when you return to the library.</p>
          </div>
        </div>
        <button id="closePlay" class="btn btn-ghost btn-icon" type="button" aria-label="Close play mode" data-tooltip="Close"><i data-lucide="x"></i></button>
      </div>
    </header>
    <div id="playPanel" class="play-pane-body">
      <ol id="prompter" class="prompter" aria-label="Script"></ol>
    </div>
    <div class="play-bar">
      <p class="play-meta"><span id="progress"></span><span id="status" role="status">Ready</span></p>
      <div class="play-bar-actions">
        <button id="start" class="btn btn-default" type="button"><i data-lucide="play" data-icon="inline-start"></i>Start rehearsal</button>
        <button id="stop" class="btn btn-secondary hidden" type="button"><i data-lucide="square" data-icon="inline-start"></i>Stop</button>
      </div>
    </div>
  </div>

  <div id="modalBackdrop" class="dialog-overlay hidden" role="presentation">
    <div class="dialog-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMessage">
      <div class="dialog-header">
        <h2 id="modalTitle" class="dialog-title"></h2>
        <p id="modalMessage" class="dialog-description"></p>
      </div>
      <form id="modalForm" class="dialog-form">
        <div id="renameFields">
          <label for="renameInput">Script name</label>
          <input id="renameInput" maxlength="200" autocomplete="off" required>
          <div id="modalError" class="error" aria-live="polite"></div>
        </div>
        <div class="dialog-footer">
          <button type="button" id="modalCancel" class="btn btn-outline">Cancel</button>
          <button type="submit" id="modalConfirm" class="btn btn-default">Save</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
