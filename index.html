async function getMicrophone(){

}

function addDialogueLine(index=script.turns.length){

function normalizeCharacters(){
  if(!script)return;

  }

  // Removing or renaming the last occurrence automatically removes the old name.
  script.meCharacter=script.meCharacter.toUpperCase();
  script.turns.filter(t=>t.who==='me').forEach(t=>t.character=script.meCharacter);
  script.otherCharacters=[...new Set(script.turns.filter(t=>t.who==='them').map(t=>(t.character||'').trim().toUpperCase()).filter(Boolean))];

function render(){

    add.onclick=e=>{e.stopPropagation();const was=menu.classList.contains('hidden');document.querySelectorAll('.block-menu').forEach(m=>m.classList.add('hidden'));menu.replaceChildren();menuItem('Add line',()=>insert('line'));menuItem('Add Beat',()=>insert('beat'));menu.classList.toggle('hidden',!was);dots.setAttribute('aria-expanded',String(was))};

      menuItem('Change to Me',()=>{t.who='me';render();queueSave(true)});menuItem('Change to Them',()=>{t.who='them';render();queueSave(true)});menuItem('Change to Beat',()=>{t.who='beat';t.duration??=2;render();queueSave(true)});
      const up=menuItem('Move up',()=>{[script.turns[i-1],script.turns[i]]=[script.turns[i],script.turns[i-1]];render();queueSave(true)});up.disabled=i===0;
      const down=menuItem('Move down',()=>{[script.turns[i+1],script.turns[i]]=[script.turns[i],script.turns[i+1]];render();queueSave(true)});down.disabled=i===script.turns.length-1;

            const option=el('button');option.type='button';
            option.append(document.createTextNode(name));
            if(name===script.meCharacter){const hint=el('span',' (me)');hint.className='me-hint';option.append(hint)}
            option.classList.toggle('selected',index===activeChoice);
            option.onmousedown=e=>e.preventDefault();
            option.onclick=()=>{character.value=name;commit()};
            choices.append(option);
          });
          choices.classList.toggle('hidden',!typed||!choices.childElementCount);
        };
        character.oninput=()=>{
          const pos=character.selectionStart;
          character.value=character.value.toUpperCase();
          character.setSelectionRange(pos,pos);
          if(character.value.trim())drawChoices();else choices.classList.add('hidden');
        };
        character.onkeydown=e=>{
          const options=[...choices.querySelectorAll('button')];
          if(!choices.classList.contains('hidden')&&options.length&&(e.key==='ArrowDown'||e.key==='ArrowUp')){
            e.preventDefault();activeChoice=(activeChoice+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;
            options.forEach((option,index)=>option.classList.toggle('selected',index===activeChoice));
            options[activeChoice].scrollIntoView({block:'nearest'});return;
          }
          if(e.key==='Enter'){
            e.preventDefault();
            if(!choices.classList.contains('hidden')&&options.length)character.value=options[activeChoice].textContent.replace(/\s*\(me\)$/i,'');
            commit(true);
          }
          if(e.key==='Escape'){choices.classList.add('hidden');character.blur()}
        };
        character.onblur=()=>{choices.classList.add('hidden');if(character.value.trim()&&character.value.trim()!==t.character){character.value=t.character||''}};
      }else{
        character.oninput=()=>{const pos=character.selectionStart;character.value=character.value.toUpperCase();character.setSelectionRange(pos,pos)};
        character.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit(true)}};
        character.onblur=()=>{if(character.value.trim()&&character.value.trim()!==script.meCharacter){script.meCharacter=character.value.trim();commit()}};
      }
      picker.append(character,choices);div.append(picker);
    }else{
      const tag=el('div','BEAT');tag.className='beat-caption';div.append(tag);
    }
    const field=el('textarea');field.className='dialogue';field.placeholder=t.who==='beat'?'(Action or beat description)':'Dialogue…';field.value=t.text||'';field.setAttribute('aria-label',t.who==='beat'?'Beat description':'Dialogue');field.oninput=()=>{t.text=field.value;field.style.height='auto';field.style.height=field.scrollHeight+'px';queueSave()};
    if(t.who!=='beat')field.onkeydown=e=>{
      if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){
        e.preventDefault();
        t.text=field.value;
        addDialogueLine(i+1);
      }
    };
    div.append(field);
    if(t.who==='beat'){
      const wrap=el('div');wrap.className='beat-duration-wrap';wrap.append(el('span','Pause (seconds)'));
      const duration=el('input');duration.type='number';duration.min='0';duration.max='120';duration.step='0.5';duration.className='beat-duration';duration.value=t.duration??2;duration.oninput=()=>{if(duration.value!=='')t.duration=Math.max(0,Math.min(120,Number(duration.value)||0));queueSave()};wrap.append(duration);div.append(wrap);
    }
    if(t.who==='them'){
      const controls=el('div');controls.className='record-controls';
      const record=el('button');record.type='button';const recordLabel=t.audio?'Rerecord audio':'Record audio';record.setAttribute('aria-label',recordLabel);setTip(record,recordLabel);
      record.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/></svg>';
      record.onclick=()=>recordLine(i,record);controls.append(record);
      if(t.audio){const listen=el('button');listen.type='button';setTip(listen,'Listen to recording');listen.setAttribute('aria-label','Listen to recording');listen.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg>';listen.onclick=()=>{const url=URL.createObjectURL(t.audio);const a=new Audio(url);a.onended=()=>URL.revokeObjectURL(url);a.onerror=()=>URL.revokeObjectURL(url);a.play()};controls.append(listen)}div.append(controls);
    }
    root.append(div);field.style.height='auto';field.style.height=Math.max(46,field.scrollHeight)+'px';
  });
  if(Math.abs(window.scrollY-savedScroll)>2)window.scrollTo({top:savedScroll,behavior:'instant'});
}
document.addEventListener('click',e=>{if(!e.target.closest('.margin-tools')&&!e.target.closest('.block-menu'))document.querySelectorAll('.block-menu').forEach(m=>m.classList.add('hidden'))});
async function recordLine(i,button){
  if(recorder){if(recorder.state!=='inactive')recorder.stop();return}
  try{
    // Track the block itself, not its position, so moves/deletes during recording can't misplace audio.
    const turn=script.turns[i];
    const mic=await getMicrophone();chunks=[];
    const currentRecorder=new MediaRecorder(mic);recorder=currentRecorder;
    currentRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    currentRecorder.onstop=()=>{
      if(turn&&turn.who==='them'&&script?.turns?.includes(turn))turn.audio=new Blob(chunks,{type:currentRecorder.mimeType});
      recorder=null;render();queueSave(true);
      // Do not stop the shared microphone here.
    };
    currentRecorder.start();button.classList.add('recording');setTip(button,'Stop recording');button.setAttribute('aria-label','Stop recording');button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>'; 
  }catch(e){alert('Microphone unavailable: '+e.message)}
}
function status(s){$('status').textContent=s}function display(){let t=script.turns[idx];$('playLine').textContent=t?(t.who==='beat'?(t.text||'Beat'):(t.text||'')):'';$('progress').textContent=t?`Line ${idx+1} of ${script.turns.length} · ${t.who==='me'?'You':t.who==='them'?'Reader':'Beat'}`:''}
$('start').onclick=async()=>{if(!script.turns.length)return alert('Add some lines first');try{const mic=await getMicrophone();audioCtx=new AudioContext();await audioCtx.resume();let source=audioCtx.createMediaStreamSource(mic);analyser=audioCtx.createAnalyser();analyser.fftSize=2048;source.connect(analyser);playing=true;idx=0;$('start').disabled=true;$('stop').disabled=false;next()}catch(e){alert('Microphone unavailable: '+e.message);stop()}};$('stop').onclick=stop;
function next(){if(!playing)return;cancelAnimationFrame(raf);if(idx>=script.turns.length){status('Scene complete');stop(true);return}display();let t=script.turns[idx];if(t.who==='beat'){let d=Number(t.duration??2),seconds=Math.max(0,Math.min(120,Number.isFinite(d)?d:2));status(`Beat — ${seconds} second${seconds===1?'':'s'}…`);beatTimer=setTimeout(()=>{beatTimer=null;idx++;next()},seconds*1000);return}if(t.who==='them'){status('Playing reader…');if(!t.audio){status('Reader recording missing — skipping');idx++;setTimeout(next,250);return}let url=URL.createObjectURL(t.audio);activeAudio=new Audio(url);activeAudio.onended=()=>{URL.revokeObjectURL(url);activeAudio=null,beatTimer=null;idx++;next()};activeAudio.onerror=()=>{URL.revokeObjectURL(url);activeAudio=null,beatTimer=null;idx++;next()};activeAudio.play().catch(e=>{status('Playback failed: '+e.message);stop()})}else{status('Listening for your line…');heard=false;speechAt=0;lastVoice=0;listen()}}
function listen(){if(!playing)return;let a=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(a);let sum=0;for(let v of a)sum+=v*v;let rms=Math.sqrt(sum/a.length),now=performance.now();const threshold=Math.max(.022,noiseFloor*2.8);if(rms>threshold){if(!speechAt)speechAt=now;if(now-speechAt>120){heard=true;lastVoice=now;status('Speaking…')}}else{speechAt=0;if(!heard)noiseFloor=noiseFloor*.98+rms*.02;if(heard&&now-lastVoice>850){idx++;next();return}}raf=requestAnimationFrame(listen)}
function stop(done=false){playing=false;cancelAnimationFrame(raf);if(beatTimer!==null){clearTimeout(beatTimer);beatTimer=null}if(activeAudio){activeAudio.pause();activeAudio=null}/* Keep microphone permission/stream alive until explicitly released. */if(audioCtx){audioCtx.close();audioCtx=null}if($('start'))$('start').disabled=false;if($('stop'))$('stop').disabled=true;if(!done&&$('status'))status('Stopped')}
</script></body></html>
